services:
  precon_all:
    build:
      context: ..  # Build context is parent directory
      dockerfile: scripts/precon_all_dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: precon_all_container
    volumes:
      # Data directory
      - ../data:/data:rw
      # Output directory
      - ../output:/output:rw
    working_dir: /data
    command: ["/bin/bash"]
    stdin_open: true
    tty: true
    environment:
      # FreeSurfer environment
      - SUBJECTS_DIR=/output
      - FS_LICENSE_ACCEPTED=Yes
      # FSL environment  
      - FSLDIR=/opt/fsl
      - FSLOUTPUTTYPE=NIFTI_GZ
      # ANTs environment (will be auto-discovered in Dockerfile)
      - ANTSPATH=/usr/local/sbin/ants/bin
      # Precon environment
      - PCP_PATH=/opt/precon_all
      # Consolidated PATH (paths will be verified in Dockerfile)
      - PATH=/opt/miniconda-latest/bin:/opt/precon_all/bin:/opt/workbench/bin_linux64:/opt/freesurfer/bin:/usr/local/sbin/ants/bin:/opt/fsl/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    networks:
      - precon_network
    deploy:
      resources:
        limits:
          memory: 14G
          cpus: '6.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    # Restart policy
    restart: unless-stopped
    # Health check - verify key tools are accessible
    healthcheck:
      test: ["CMD-SHELL", "python3 --version && ls /opt/freesurfer/bin/mris_convert && ls /usr/local/sbin/ants/bin/antsApplyTransforms"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Security options
    #security_opt:
    #  - no-new-privileges:true

networks:
  precon_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
